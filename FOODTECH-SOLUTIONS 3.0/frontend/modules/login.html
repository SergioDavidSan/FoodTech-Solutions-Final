<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tech - Login</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="../imagenes/logo_food_tech.png" alt="Food Tech Solutions">
                <h1>Food Tech Solutions</h1>
                <p class="slogan">"Rápido, fácil, delicioso"</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="rol">Selecciona tu Rol:</label>
                    <select id="rol" name="rol" required>
                        <option value="">-- Selecciona tu rol --</option>
                        <option value="administrador">👨‍💼 Administrador</option>
                        <option value="mesero">💁 Mesero</option>
                        <option value="cajero">💰 Cajero</option>
                        <option value="cocinero">👨‍🍳 Cocinero</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" 
                           placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" 
                           placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-login">🚀 Ingresar al Sistema</button>
            </form>

            <div class="login-footer">
                <p>¿Problemas para ingresar? <a href="#">Contactar soporte</a></p>
            </div>
        </div>
    </div>

    <!-- ✅ AGREGAR ESTAS 2 LÍNEAS -->
    <script src="../scripts/services/apiService.js"></script>
    <script src="../scripts/services/authService.js"></script>
    <script src="../scripts/login.js"></script>
</body>
</html>
