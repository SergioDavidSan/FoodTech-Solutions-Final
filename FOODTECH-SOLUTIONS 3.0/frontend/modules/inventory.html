<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - FoodTech Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/inventory.css">
</head>
<body>
    
    <header class="main-header">
        <div class="header-left">
            <div class="logo"><i class="fa-solid fa-boxes-stacked"></i> FoodTech <span>Inventory</span></div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span class="user-role">📦 Logística</span>
                <span class="user-name" id="userName">Gerente</span>
            </div>
            <div class="header-icons">
                <button class="icon-btn" title="Notificaciones">
                    <i class="fa-solid fa-bell"></i>
                    <span class="badge">2</span>
                </button>
                <button class="icon-btn logout" id="logout-button" title="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="app-container">
        
        <main class="main-content">
            
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-text">
                        <span class="label">Total Productos</span>
                        <span class="value" id="totalProducts">0</span>
                    </div>
                    <div class="metric-icon blue">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-text">
                        <span class="label">Stock Bajo</span>
                        <span class="value warning" id="lowStockCount">0</span>
                    </div>
                    <div class="metric-icon yellow">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-text">
                        <span class="label">Agotados</span>
                        <span class="value danger" id="outOfStockCount">0</span>
                    </div>
                    <div class="metric-icon red">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </div>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="search" id="inventorySearch" placeholder="Buscar por nombre, código o proveedor...">
                </div>
                <div class="filters">
                    <select id="categoryFilter" class="filter-select">
                        <option value="">📂 Todas las categorías</option>
                        <option value="1">Platos Fuertes</option>
                        <option value="2">Bebidas</option>
                        <option value="3">Postres</option>
                        <option value="4">Entradas</option>
                    </select>
                    <select id="stockFilter" class="filter-select">
                        <option value="">📊 Estado del Stock</option>
                        <option value="low">⚠️ Stock Bajo</option>
                        <option value="out">❌ Agotado</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Mínimo</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Cargando inventario...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="sidebar">
            <div class="form-card">
                <div class="form-header">
                    <h3 id="formTitle">Nuevo Producto</h3>
                    <button class="btn-reset" id="btnResetForm" title="Limpiar formulario"><i class="fa-solid fa-eraser"></i></button>
                </div>

                <form id="productForm">
                    <input type="hidden" id="productId">

                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="productName" placeholder="Ej: Queso Mozzarella" required>
                    </div>

                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="productCategory" required>
                            <option value="">Seleccionar...</option>
                            <option value="1">Platos Fuertes</option>
                            <option value="2">Bebidas</option>
                            <option value="3">Postres</option>
                            <option value="4">Entradas</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Precio ($)</label>
                            <input type="number" id="productPrice" min="0" step="100" required>
                        </div>
                        <div class="form-group">
                            <label>Stock Inicial</label>
                            <input type="number" id="productStock" min="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Stock Mínimo (Alerta)</label>
                        <input type="number" id="minStock" min="0" value="5">
                    </div>
                    <div class="form-group">
                         <label>Unidad de Medida</label>
                         <input type="text" id="productUnit" placeholder="Ej: Kg, Litro, Unidad" required>
                    </div>

                    <div class="form-group">
                        <label>Proveedor</label>
                        <input type="text" id="productSupplier" placeholder="Ej: Distribuidora SAS">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save" id="saveProduct"> <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>

            <div class="alerts-panel">
                <h4><i class="fa-solid fa-bell"></i> Alertas Recientes</h4>
                <div class="alerts-list" id="stockAlerts">
                    <div class="alert-item warning">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <div>
                            <strong>Papas Fritas</strong>
                            <small>Quedan 2 unidades</small>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="../scripts/services/apiService.js"></script>
    <script src="../scripts/services/authService.js"></script>
    <script src="../scripts/inventory.js"></script>

</body>
</html>
